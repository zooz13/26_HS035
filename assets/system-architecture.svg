<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
<title id="title">Wi-Fi CSI 시스템 구성도</title><desc id="desc">ESP32-S3 TX/RX, Gateway, Model Server, Dashboard의 데이터와 제어 흐름, Gateway의 직접 S3 업로드와 로컬 저장 경로</desc>
<defs>
<marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2368b0"/></marker>
<marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087e8b"/></marker>
</defs>
<rect width="1600" height="950" fill="#f6f9fc"/>
<g font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" fill="#152c44">
<text x="48" y="70" font-size="38" font-weight="700" fill="#152c44" text-anchor="start">Wi-Fi CSI 실내 잔류 가능성 판단</text>
<text x="48" y="113" font-size="23" font-weight="400" fill="#51677d" text-anchor="start">센싱부터 상태 분석·시각화까지의 서비스 구성</text>
<path d="M 50 165 H 110" fill="none" stroke="#2368b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/>
<text x="125" y="172" font-size="19" font-weight="600" fill="#2368b0" text-anchor="start">데이터·결과</text>
<path d="M 330 165 H 390" fill="none" stroke="#087e8b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#teal-arrow)"/>
<text x="405" y="172" font-size="19" font-weight="600" fill="#087e8b" text-anchor="start">제어·조회·응답</text>
<text x="1548" y="172" font-size="18" font-weight="400" fill="#51677d" text-anchor="end">화살표는 실제 요청·전달 방향</text>
<rect x="48" y="230" width="280" height="320" rx="16" fill="white" stroke="#c9d7e5" stroke-width="2"/>
<rect x="68" y="252" width="5" height="30" rx="2" fill="#2368b0"/>
<text x="86" y="276" font-size="24" font-weight="700" fill="#152c44" text-anchor="start">01  CSI 센싱</text>
<text x="70" y="322" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">ESP32-S3 TX / RX</text>
<text x="70" y="359" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">TX → RX: Wi-Fi 패킷</text>
<text x="70" y="396" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">RX: CSI 수집·UART 출력</text>
<text x="70" y="433" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">RX ↔ TX: 제어·적용 ACK</text>
<text x="70" y="527" font-size="18" font-weight="600" fill="#2368b0" text-anchor="start">C · ESP-IDF · ESP-NOW</text>
<rect x="416" y="230" width="300" height="320" rx="16" fill="white" stroke="#c9d7e5" stroke-width="2"/>
<rect x="436" y="252" width="5" height="30" rx="2" fill="#2368b0"/>
<text x="454" y="276" font-size="24" font-weight="700" fill="#152c44" text-anchor="start">02  Gateway</text>
<text x="438" y="322" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">UART 수신 · CSI 파싱</text>
<text x="438" y="359" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">진폭 변환 · Window 구성</text>
<text x="438" y="396" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">Baseline·모델 입력 생성</text>
<text x="438" y="433" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">추론·Setup·Presign 요청</text>
<text x="438" y="527" font-size="18" font-weight="600" fill="#2368b0" text-anchor="start">Python · PC / Raspberry Pi</text>
<rect x="800" y="230" width="320" height="320" rx="16" fill="white" stroke="#c9d7e5" stroke-width="2"/>
<rect x="820" y="252" width="5" height="30" rx="2" fill="#2368b0"/>
<text x="838" y="276" font-size="24" font-weight="700" fill="#152c44" text-anchor="start">03  Model Server</text>
<text x="822" y="322" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">Stage 1  빈 공간 / 재실</text>
<text x="822" y="359" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">Stage 2  정적 / 움직임</text>
<text x="822" y="396" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">최근 이력 기반 위험도 평가</text>
<text x="822" y="433" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">방 설정 · 상태·이력 관리</text>
<text x="822" y="527" font-size="18" font-weight="600" fill="#2368b0" text-anchor="start">FastAPI · PyTorch · EC2</text>
<rect x="1232" y="230" width="320" height="320" rx="16" fill="white" stroke="#c9d7e5" stroke-width="2"/>
<rect x="1252" y="252" width="5" height="30" rx="2" fill="#2368b0"/>
<text x="1270" y="276" font-size="24" font-weight="700" fill="#152c44" text-anchor="start">04  Dashboard</text>
<text x="1254" y="322" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">방 등록 · 기준 설정 요청</text>
<text x="1254" y="359" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">최신 상태 · 결과 조회</text>
<text x="1254" y="396" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">재난 이벤트 입력 · 위험도 표시</text>
<text x="1254" y="433" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">이벤트 로그 조회</text>
<text x="1254" y="527" font-size="18" font-weight="600" fill="#2368b0" text-anchor="start">HTML · CSS · JavaScript</text>
<path d="M 328 355 H 416" fill="none" stroke="#2368b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/>
<text x="372" y="337" font-size="16" font-weight="600" fill="#2368b0" text-anchor="middle">CSI·ACK</text>
<path d="M 416 435 H 328" fill="none" stroke="#087e8b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#teal-arrow)"/>
<text x="372" y="468" font-size="16" font-weight="600" fill="#087e8b" text-anchor="middle">제어 명령</text>
<path d="M 716 355 H 800" fill="none" stroke="#2368b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/>
<text x="758" y="337" font-size="15" font-weight="600" fill="#2368b0" text-anchor="middle">HTTP 요청</text>
<path d="M 800 435 H 716" fill="none" stroke="#087e8b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#teal-arrow)"/>
<text x="758" y="468" font-size="16" font-weight="600" fill="#087e8b" text-anchor="middle">상태·URL</text>
<path d="M 1232 355 H 1120" fill="none" stroke="#087e8b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#teal-arrow)"/>
<text x="1176" y="337" font-size="16" font-weight="600" fill="#087e8b" text-anchor="middle">HTTP 요청</text>
<path d="M 1120 435 H 1232" fill="none" stroke="#2368b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/>
<text x="1176" y="468" font-size="16" font-weight="600" fill="#2368b0" text-anchor="middle">JSON 응답</text>
<path d="M 516 550 V 680" fill="none" stroke="#2368b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/>
<text x="502" y="632" font-size="18" font-weight="600" fill="#2368b0" text-anchor="end">파일 저장</text>
<path d="M 652 550 V 610 H 960 V 680" fill="none" stroke="#2368b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/>
<text x="807" y="593" font-size="20" font-weight="600" fill="#2368b0" text-anchor="middle">Presigned PUT</text>
<rect x="48" y="680" width="280" height="170" rx="16" fill="white" stroke="#c9d7e5" stroke-width="2"/>
<rect x="68" y="702" width="5" height="30" rx="2" fill="#087e8b"/>
<text x="86" y="726" font-size="24" font-weight="700" fill="#152c44" text-anchor="start">송신 조건 제어</text>
<text x="70" y="772" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">Gateway 로컬 UI에서 요청</text>
<text x="70" y="809" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">RX 중계 후 TX ACK 확인</text>
<rect x="416" y="680" width="300" height="170" rx="16" fill="white" stroke="#c9d7e5" stroke-width="2"/>
<rect x="436" y="702" width="5" height="30" rx="2" fill="#2368b0"/>
<text x="454" y="726" font-size="24" font-weight="700" fill="#152c44" text-anchor="start">로컬 파일 · Spool</text>
<text x="438" y="772" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">원시·전처리 데이터 저장</text>
<text x="438" y="809" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">전송 실패 데이터 보관</text>
<rect x="800" y="680" width="320" height="170" rx="16" fill="white" stroke="#c9d7e5" stroke-width="2"/>
<rect x="820" y="702" width="5" height="30" rx="2" fill="#2368b0"/>
<text x="838" y="726" font-size="24" font-weight="700" fill="#152c44" text-anchor="start">AWS S3</text>
<text x="822" y="772" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">원시·전처리 데이터 객체</text>
<text x="822" y="809" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">서명 URL은 서버에서 발급</text>
<rect x="1232" y="680" width="320" height="170" rx="16" fill="white" stroke="#c9d7e5" stroke-width="2"/>
<rect x="1252" y="702" width="5" height="30" rx="2" fill="#087e8b"/>
<text x="1270" y="726" font-size="24" font-weight="700" fill="#152c44" text-anchor="start">판단 결과 활용</text>
<text x="1254" y="772" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">관리자·보호자의 우선 확인</text>
<text x="1254" y="809" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">위험도와 판단 근거 제공</text>
<text x="48" y="907" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">S3 저장과 실시간 추론은 별도 경로입니다. Dashboard는 HTTP polling으로 서버 상태를 조회합니다.</text>
</g></svg>

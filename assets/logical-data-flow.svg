<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1010" viewBox="0 0 1440 1010" role="img" aria-labelledby="title desc">
<title id="title">논리 데이터 관계도</title><desc id="desc">방 설정과 Baseline, Calibration, CSI Window, 추론 결과, 메모리 상태 이력, 재난 이벤트 입력, 위험도 평가 및 대시보드의 관계. 관계형 데이터베이스 스키마가 아님.</desc>
<defs>
<marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2368b0"/></marker>
<marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087e8b"/></marker>
</defs>
<rect width="1440" height="1010" fill="#f6f9fc"/>
<g font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" fill="#152c44">
<text x="60" y="70" font-size="38" font-weight="700" fill="#152c44" text-anchor="start">논리 데이터 관계</text>
<text x="60" y="113" font-size="23" font-weight="400" fill="#51677d" text-anchor="start">API 객체와 서버 메모리 상태를 기준으로 표현한 데이터 흐름</text>
<rect x="60" y="180" width="330" height="160" rx="16" fill="white" stroke="#c9d7e5" stroke-width="2"/>
<rect x="80" y="202" width="5" height="30" rx="2" fill="#2368b0"/>
<text x="98" y="226" font-size="24" font-weight="700" fill="#152c44" text-anchor="start">방 설정</text>
<text x="82" y="272" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">room_id · device_group_id</text>
<text x="82" y="309" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">baseline_id · calibration_id</text>
<rect x="540" y="180" width="330" height="160" rx="16" fill="white" stroke="#c9d7e5" stroke-width="2"/>
<rect x="560" y="202" width="5" height="30" rx="2" fill="#2368b0"/>
<text x="578" y="226" font-size="24" font-weight="700" fill="#152c44" text-anchor="start">Baseline · Calibration</text>
<text x="562" y="272" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">공간별 빈 방 기준 정보</text>
<text x="562" y="309" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">Stage 1 보정 임계값</text>
<rect x="1020" y="180" width="330" height="160" rx="16" fill="white" stroke="#c9d7e5" stroke-width="2"/>
<rect x="1040" y="202" width="5" height="30" rx="2" fill="#087e8b"/>
<text x="1058" y="226" font-size="24" font-weight="700" fill="#152c44" text-anchor="start">재난 이벤트 입력</text>
<text x="1042" y="272" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">대시보드에서 평가 요청</text>
<text x="1042" y="309" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">room_id · event_timestamp</text>
<rect x="60" y="440" width="330" height="180" rx="16" fill="white" stroke="#c9d7e5" stroke-width="2"/>
<rect x="80" y="462" width="5" height="30" rx="2" fill="#2368b0"/>
<text x="98" y="486" font-size="24" font-weight="700" fill="#152c44" text-anchor="start">CSI Window</text>
<text x="82" y="532" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">방·기준 정보 ID · 수집 시각</text>
<text x="82" y="569" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">Stage 1 특징 · motion_input</text>
<text x="82" y="597" font-size="18" font-weight="600" fill="#2368b0" text-anchor="start">Gateway → HTTP API</text>
<rect x="540" y="440" width="330" height="180" rx="16" fill="white" stroke="#c9d7e5" stroke-width="2"/>
<rect x="560" y="462" width="5" height="30" rx="2" fill="#2368b0"/>
<text x="578" y="486" font-size="24" font-weight="700" fill="#152c44" text-anchor="start">추론 결과</text>
<text x="562" y="532" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">Stage 1: empty / occupied</text>
<text x="562" y="569" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">Stage 2: static / moving</text>
<text x="562" y="597" font-size="18" font-weight="600" fill="#2368b0" text-anchor="start">최종 상태 · 추론 시각</text>
<rect x="1020" y="440" width="330" height="180" rx="16" fill="white" stroke="#c9d7e5" stroke-width="2"/>
<rect x="1040" y="462" width="5" height="30" rx="2" fill="#2368b0"/>
<text x="1058" y="486" font-size="24" font-weight="700" fill="#152c44" text-anchor="start">최신 결과 · 상태 이력</text>
<text x="1042" y="532" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">방별 최신 결과와 최근 이력</text>
<text x="1042" y="569" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">메모리에서 저장·조회</text>
<text x="1042" y="597" font-size="18" font-weight="600" fill="#2368b0" text-anchor="start">서버 실행 중 관리</text>
<rect x="540" y="770" width="330" height="170" rx="16" fill="white" stroke="#c9d7e5" stroke-width="2"/>
<rect x="560" y="792" width="5" height="30" rx="2" fill="#087e8b"/>
<text x="578" y="816" font-size="24" font-weight="700" fill="#152c44" text-anchor="start">잔류 위험도 평가</text>
<text x="562" y="862" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">재실·움직임 비율 · 지속 시간</text>
<text x="562" y="899" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">위험 수준 · 판단 근거</text>
<rect x="60" y="770" width="330" height="170" rx="16" fill="white" stroke="#c9d7e5" stroke-width="2"/>
<rect x="80" y="792" width="5" height="30" rx="2" fill="#2368b0"/>
<text x="98" y="816" font-size="24" font-weight="700" fill="#152c44" text-anchor="start">Dashboard</text>
<text x="82" y="862" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">상태·위험도·판단 근거 표시</text>
<text x="82" y="899" font-size="20" font-weight="400" fill="#51677d" text-anchor="start">우선 확인할 공간 파악</text>
<path d="M 390 260 H 540" fill="none" stroke="#2368b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/>
<text x="465" y="243" font-size="18" font-weight="600" fill="#2368b0" text-anchor="middle">기준 정보 참조</text>
<path d="M 225 340 V 440" fill="none" stroke="#2368b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/>
<text x="245" y="398" font-size="18" font-weight="600" fill="#2368b0" text-anchor="start">방·기준 ID</text>
<path d="M 705 340 V 440" fill="none" stroke="#2368b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/>
<text x="725" y="398" font-size="18" font-weight="600" fill="#2368b0" text-anchor="start">보정 임계값</text>
<path d="M 390 530 H 540" fill="none" stroke="#2368b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/>
<text x="465" y="511" font-size="18" font-weight="600" fill="#2368b0" text-anchor="middle">분석 입력</text>
<path d="M 870 530 H 1020" fill="none" stroke="#2368b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/>
<text x="945" y="511" font-size="18" font-weight="600" fill="#2368b0" text-anchor="middle">결과 누적</text>
<path d="M 1185 620 V 680 H 790 V 770" fill="none" stroke="#2368b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/>
<text x="980" y="663" font-size="18" font-weight="600" fill="#2368b0" text-anchor="middle">이벤트 시각 기준 최근 이력</text>
<path d="M 1350 260 H 1390 V 855 H 870" fill="none" stroke="#087e8b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#teal-arrow)"/>
<text x="1120" y="832" font-size="19" font-weight="600" fill="#087e8b" text-anchor="middle">평가 요청 · 이벤트 시각</text>
<path d="M 540 855 H 390" fill="none" stroke="#2368b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/>
<text x="465" y="837" font-size="18" font-weight="600" fill="#2368b0" text-anchor="middle">평가 결과</text>
<text x="60" y="986" font-size="19" font-weight="400" fill="#51677d" text-anchor="start">원시·전처리 데이터 파일은 로컬/S3에 별도 저장합니다. 위 관계는 실제 관계형 DB 테이블을 뜻하지 않습니다.</text>
</g></svg>
